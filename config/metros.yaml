# Metro/region grouping so users compare apples-to-apples within their area instead
# of against the whole state. Each hospital_id belongs to exactly one metro; ids must
# match config/hospitals.yaml. Used for the metro filter AND the SEO landing pages.
# ponytail: explicit id lists beat guessing metro from city strings.
#
# `states` = the markets the app offers (home selector, /<slug>/procedure/<code> statewide
# SEO pages, sitemap). Add a state here only once its hospitals are in hospitals.yaml.
# Each metro carries `state:`; `promote: true` puts the metro in the sitemap + home footer.
states:
  - { code: AZ, name: Arizona, slug: arizona }
  - { code: CA, name: California, slug: california }
  - { code: UT, name: Utah, slug: utah }
  - { code: NM, name: New Mexico, slug: new-mexico }
  - { code: CO, name: Colorado, slug: colorado }
  - { code: TX, name: Texas, slug: texas }
  - { code: NV, name: Nevada, slug: nevada }     # scaffold: no hospitals yet -> hidden + "coming soon" pages

