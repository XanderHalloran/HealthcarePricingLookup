# Episode (bundle) definitions for /bundles. Each component is priced three ways where data exists:
#   Medicare (fee schedules), market hospital-based (MRF typical price), ASC-based (published or implied).
# Component kinds:
#   facility: CPT whose facility price comes from the MRFs (hospital typical) / ASC published-or-implied / OPPS & ASC
#   drg:      inpatient alternative for the facility component (market DRG median vs IPPS)
#   pro:      surgeon fee = Medicare PFS (facility RVUs x CF) x commercial_multiplier
#   anesthesia: (base_units + minutes/15) x anesthesia_cf x commercial_multiplier  (CMS anesthesia base units)
#   visits:   pre-op / rehab items = PFS x n x commercial_multiplier
# Assumptions are visible on the page and editable here. Implants are NOT separate: hospital and ASC
# facility rates published under the rule include them (CORE's case rates say so explicitly).
commercial_multiplier: 1.4      # commercial professional rates vs Medicare (editable assumption)
anesthesia_cf: 20.3178          # CY2025 national anesthesia conversion factor, $ per unit
episodes:
