    label: "Total knee replacement"
    facility: "27447"
    drg: "470"
    pro: "27447"
    anesthesia: { code: "01402", base_units: 7, minutes: 120 }
    visits:
      - { code: "99204", n: 1,  label: "Pre-op consult (new patient)" }
