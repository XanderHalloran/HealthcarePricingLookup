# Joins the existing Caddy network (travelmap_default) so the shared Caddy ingress
# reaches this app by name (reverse_proxy healthcare-app:8200). No published port —
# the app is NOT exposed publicly; only Caddy can reach it.
services:
  app:
    build: .
    image: healthcare-app
    container_name: healthcare-app
    restart: unless-stopped
    environment:
      # Enables the bill-photo/EOB OCR endpoint. Unset -> feature degrades gracefully.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # "Email me this letter/comparison" (src/capture.py). Unset -> the option is hidden.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    networks:
      - travelmap_default
    volumes:
      - healthcare_data:/app/data

networks:
  travelmap_default:
    external: true

volumes:
  healthcare_data:
